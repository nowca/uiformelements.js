		#dragbar:hover {

		}

			padding: 7px 4px;

			height: 30px;
    		margin: 1px;
    		padding-left: 12px;

    		background-color: #666;
    		width: 360px;

		<textarea autocomplete="on" id="textareaCode" wrap="logical" spellcheck="false"><!DOCTYPE html>
<html lang="en">
<head>

        <div class="Tab" id="tab-group-1" title="Fieldset Tab Group">
            <div class="Group" inline=true>
                <div class="Label" id="label-1" inline=false>Labeltext</div>

            "main-container",

<script>

		getLocationType: function()
		{
		    if (window.location.protocol == 'file:')
		    {
		    	return 0;
		    }

		    if (!window.location.host.replace(/localhost|127\.0\.0\.1/i, ''))
		    {
		    	return 2;
		    }

		    return 1;
		},
		openFile: function()
		{
			var input = document.createElement("input");
			input.type = "file";
			input.setAttribute("multiple", false);
			input.setAttribute("accept", "text/html");
			input.onchange = function (event)
			{
			    console.log(this.files);
			};
			input.click();
		},
		insertToCodeMirror: function(text, cursorPos, group)
		{
			var doc = window.editor.getDoc();
			var cursor = window.editor.getCursor();
			doc.replaceRange(text, cursor);
			window.editor.focus();
			var length = cursorPos != undefined ? cursorPos : text.length
			cursor.ch += length;
			window.editor.setCursor(cursor);
			
			if (group != undefined)
			{
				var token = window.editor.getTokenAt(window.editor.getCursor());
				var indentationLevel = token.state.htmlState.indented;
				var identationString = "";

				

				for (var i = 0; i < indentationLevel; i++)
				{
					identationString += " ";
				}

				doc.replaceRange("\n\n" + identationString, cursor);
				cursor.line++;
				window.editor.setCursor(cursor);
				doc.replaceRange(identationString + "    ", cursor);
			}
			
			submitTryit(1);
		},

		{

	function submitTryit(n) {
		if (window.editor)
		{
			window.editor.save();
		}

		var text = $Id("textareaCode").value;

		if (window.editor)
		{
			text = window.editor.getDoc().getValue("\n");
		}
		text = text.replace(/\n\n\n/g,"\n\n"); // normalize newlines (??!!)
		
		var ifc = $Id("iframecontainer");
		var ifr = $Id("iframeResult");
		var ifrw = (ifr.contentWindow) ? ifr.contentWindow : (ifr.contentDocument.document) ? ifr.contentDocument.document : ifr.contentDocument;

		ifrw.document.open();
		ifrw.document.write(text);
		ifrw.document.close();

		if (ifrw.document.body && !ifrw.document.body.isContentEditable)
		{
			ifrw.document.body.contentEditable = true;
			ifrw.document.body.contentEditable = false;
		}

		var themeSelector = $Id("theme-selection");

		if (themeSelector != undefined)
		{
			UILiveEditor.setTheme(themeSelector.value);
		}

		UILiveEditor.setDocumentTitle();
	}

	function reEdited() {
		var text = frameHTML();
		$Id("textareaCode").value = text;
		window.editor.getDoc().setValue(text);
	}

	var layout = "horizontal";
	var leftwidthperc = 50 ;
	var leftheightperc = 50 ;

	function restack() {
		var l = $Id("textareacontainer");
		var c = $Id("dragbar");
		var r = $Id("iframecontainer");
		if (layout == "vertical") {
			l.style["height"] = c.style["height"] = r.style["height"] = "100%";
			l.style["width"] = "calc(" + leftwidthperc + "% - 6px)";
			c.style["width"] = "12px";
			c.style["cursor"] = "col-resize";
			r.style["width"] = "calc(" + (100 - leftwidthperc) + "% - 6px)";
			layout = "horizontal"
		} else {
			l.style["width"] = c.style["width"] = r.style["width"] = "100%";
			l.style["height"] = "calc(" + leftheightperc + "% - 6px)";
			c.style["height"] = "12px";
			c.style["cursor"] = "row-resize";
			r.style["height"] = "calc(" + (100 - leftheightperc) + "% - 6px)";
			layout = "vertical"		
		}
	}

	dragBalance($Id(("dragbar")));

	function dragBalance(balancer) {
		if (window.addEventListener) {
			balancer.addEventListener("mousedown", function(e) {dragstart(e);});
			window.addEventListener("mousemove", function(e) {dragmove(e);});
			window.addEventListener("mouseup", dragend);
		}

		var dragging = false;
		var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
		function dragstart(e) {
			e.preventDefault();
			e = e || window.event;
			// get the mouse cursor position at startup:
			pos3 = e.clientX;
			pos4 = e.clientY;
			dragging = true;
		}
		function dragmove(e) {
			var perc;
			if (dragging) {
				// show overlay to avoid interfering of mouse moving with textarea
				$Id("shield").style.display = "block";        
				e = e || window.event;
				// calculate the new cursor position:
				pos1 = pos3 - e.clientX;
				pos2 = pos4 - e.clientY;
				pos3 = e.clientX;
				pos4 = e.clientY;
				// set the element's new size:
				if (layout == "vertical") {
					var pos = pos2;
					var axe1 = "clientHeight";
					var axe2 = "height";
					perc = (balancer.previousElementSibling[axe1] + (balancer[axe1] / 2) - pos) * 100 / balancer.parentElement[axe1];
					leftheightperc = perc;
				} else {
					var pos = pos1;
					var axe1 = "clientWidth";
					var axe2 = "width";
					perc = (balancer.previousElementSibling[axe1] + (balancer[axe1] / 2) - pos) * 100 / balancer.parentElement[axe1];
					leftwidthperc = perc;
				}
				if (perc > 20 && perc < 80) {
					balancer.previousElementSibling.style[axe2] = "calc(" + (perc) + "% - " + (balancer[axe1] / 2) + "px)";
					balancer.nextElementSibling.style[axe2] = "calc(" + (100 - perc) + "% - " + (balancer[axe1] / 2) + "px)";
				}
			}
		}
		function dragend() {
			$Id("shield").style.display = "none";
			dragging = false;
			if (window.editor) {
				window.editor.refresh();
			}
		}
	}

	function keypressed(e) {
		if (e.key != "ArrowLeft" && e.key != "ArrowRight" && e.key != "ArrowUp" && e.key != "ArrowDown") {submitTryit(1)};

	function keypressedinframe(e) {
		if (e.key != "ArrowLeft" && e.key != "ArrowRight" && e.key != "ArrowUp" && e.key != "ArrowDown") {reEdited()};

	function frameHTML() {
		var ifrw = frameWindow();
		ifrw.document.body.removeAttribute("contentEditable");// = false;
		var text = "<!DOCTYPE html>\n<html>\n" + ifrw.document.documentElement.innerHTML.replace(/^\n+|\n+$/g,'').trim() + "\n</html>";
		text = text.replace(/\n\n\n/g,"\n\n"); // normalize newlines (??!!)
		return text;
	}
	
	function loadFile() {
		UILiveEditor.openFile()

		var name = $Id("filename").value;
		var xhr = new XMLHttpRequest();
		xhr.open('GET', name);
		xhr.onreadystatechange = function()
		{
			if (xhr.readyState == XMLHttpRequest.DONE)
			{
				if (xhr.status === 200)
				{
					if (window.editor)
					{
						var ifr = $Id("iframeResult");
						var sourceText = xhr.responseText;
						sourceText = sourceText.replace("</head>", '    <!-- UIFormElements.js -->\n    <script src="js/ui-form-elements.production.min.js"><\/script>\n<\/head>');
						sourceText = sourceText.replace("</head>", '    <!-- UIFormElements.js CSS-Themes: -->\n    <link rel="stylesheet" href="css/ui-form-elements.themes.css">\n<\/head>');
						window.editor.getDoc().setValue(sourceText);
						submitTryit(1);
					}
		        }
		        else
		        {
		           	console.error(xhr.statusText);
		        }
			}
		}
		xhr.onerror = function(error)
		{
			console.error(error);
		}
		xhr.send();
	}

	function getName() {
		var name = $Id("filename").value;
		return name = name.slice(name.lastIndexOf("/") + 1);		
	}

	function downloadFile() {
		var text = frameHTML();
		//text = window.editor.getDoc().getValue("\n");
		var blob = new Blob([text], {type: "text/html;charset=utf-8"});
		saveAs(blob, getName());
	}

			$Id("switchflag").innerHTML = "OFF";

		reEdited();
