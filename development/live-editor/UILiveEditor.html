	<style>
		* {
			-webkit-box-sizing: border-box;
			-moz-box-sizing: border-box;
			box-sizing: border-box;
			font-size: 12px;
		}

		body {
			background-color: #3C3C3C;
			color: #474C58 !important;
			margin: 0px;
			overflow: hidden;
		}

		select {
			color: #474C58 !important;
		}

		ul {
			list-style-type: none;
			margin: 0;
			padding: 0px 10px;
			overflow: hidden;
		}

		li {
			float: left;
			margin-bottom: 8px;
		}

		li.seperator {
		    width: 32px;
		    height: 32px;
		}

		button {
			margin: 1px 0 1px 0;
			height: 30px;
			color: #474C58;
			border-radius: 4px;
		}

		.hidden {
			display: none !important;
		}

		.tool-bar button,
		.bottom-bar button {
			height: 30px !important;
			margin-top: 0 !important;
		}

		.bar-element button {
			height: 24px;
			margin-top: 4px;
		}

		button:enabled {
		    background-color: #E0E0E2;
		    border: 1px solid #E0E0E2;
		}

		button:hover:enabled {
		    background-color: #D4D4D6 !important;
		}

		button:active:enabled {
		    background-color: #E0E8ED !important;
		}

		#textareacontainer > ul > *, #top-bar-title,
		#iframecontainer > ul > *,
		#document-title,
		#theme {
			display: inline-block;
			font-family: Verdana, Arial, monospace !important;
			font-size: 12px;
		}

		#document-title,
		#theme {
			color: #ffffff;
		}

		#theme {
			position: absolute;
    		right: 0;
		}

		#textareacontainer > ul,
		#iframecontainer > ul {
			position: relative;
    		width: 100%;
		}

		#top-bar-title {
			height: 32px;
		    padding: 10px 0 10px 24px !important;
		    color: #ffffff;
		    position: absolute;
		    width: 360px;
		    font-weight: bold;
		    font-size: 12px;
			background-color: #406161;
			font-weight: bold;	
		}

		#top-bar .bar-element {
		    left: 360px;
		}

		.bar-element {
			min-height: 32px;
		    padding: 0;
		    color: #ffffff;
		}

		.bar-element-top {
			height: 32px;
		}

		.bottom-bar {
			position: absolute;
			height: 58px;
    		padding: 14px 0 0 10px;
    		overflow-y: scroll;
    		bottom: 0;
    		width: 100%;
		}

		.tool-bar {
			color: #cccccc;
			background-color: #4C4C4C;
			display: inline-block;
		    width: 140px !important;
		    position: absolute !important;
		    height: calc(100% - 32px);
		    padding: 14px 10px;
		    overflow-y: auto;
    		overflow-x: hidden;
		}

		.tool-bar li {
			display: block !important;
			float: none;
			margin-bottom: 8px;
		}

		.tool-bar button {
			width: 98%;
		}

		.tool-bar .Checkbox > input {
			margin: 0 !important;
		}

		.bottom-bar * {
    		white-space: nowrap;
			overflow: hidden !important;
		}

		#container {
			margin: 0;
		    position: absolute;
		    height: calc(100% - 58px);
		    width: 100%;
		    top: 0px;
		    left: 0;
		    right: 0;
		}

		#textareacontainer,
		#dragbar,
		#iframecontainer {
			float: left;
			height: 100%;
			width: calc(50% - 6px);
		}

		#dragbar {
			position: relative;
			width: 10px;
			box-shadow: none;
			cursor: col-resize;
		}

		#dragbar:hover {
			background-color: #4D4D4D;
		}

		#dragbar div {
			position: absolute;
		    width: 5px;
		    height: 64px;
		    border: 2px dotted #888888;
		    left: 2px;
		    bottom: 50%;
		}

		#filename {
			border: 0;
			color: #aaaaaa;
    		background: #4C4C4C;
			width: 300px;
			padding: 7px 4px;
			text-align: left;
			height: 30px;
    		margin: 1px;
    		padding-left: 12px;
		}

		#shield {
			display: none;
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 4;
		}

		#framesize span {
			font-family: Consolas, monospace;
		}

		#iframe-subcontainer {
			height: calc(100% - 64px);
			border: 1px solid #666;
		}

		#iframeResult {
			background-color: #ffffff;
		    border: none;
		    height: 100%;
		    width: 100%;
		}

		#document-title {
			background-color: #667788 !important;
			display: inline-block;
			height: 32px;
    		background-color: #666;
    		width: 100%;
		    font-weight: bold;
		    line-height: 32px;
		    padding-left: 32px;
		}

		#theme {
			display: inline-block;
			padding-left: 32px;
    		background-color: #666;
    		height: 32px;
		}

		#theme select {
			margin-left: 16px;
			margin-right: 10px;
			margin-top: 4px;
			height: 24px !important;
			border-radius: 4px;
		}

		[class*="tit-icon-"] {
			/*font: normal normal normal 18px/1 tit-fontello;*/
			text-rendering: auto;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			padding: 8px 10px;
		}

		.CodeMirror {
			font-family: monospace !important;
			font-size: 12px;
    		margin-left: 140px;
			line-height: normal;
			padding: 8px;
			width: calc(100% - 140px);
			box-shadow: 0px 0px 10px 4px #cccccc inset;
			height: calc(100% - 32px);
		    border: 1px solid #666;
		}

		.CodeMirror-lines {
			padding-left: 0.5rem;
		}

		.CodeMirror-linenumber {
			left: -1rem !important;
		}

		.CodeMirror-hscrollbar {
			left: 40px !important;
		}

		.CodeMirror-vscrollbar {
			pointer-events: unset !important;
		}

		.right {
			position: absolute;
   			right: 0;
		}

		* {
		    user-select: none;
		    -ms-user-select: none;
		    -moz-user-select: none;
		    -webkit-user-select: none;
		}

		.CodeMirror * {
		    user-select: text !important;
		    -ms-user-select: text !important;
		    -moz-user-select: text !important;
		    -webkit-user-select: text !important;
		}
	</style>

		insertToCodeMirror: function(text, cursorPos, group)
		{
			cursorPos = UILiveEditor.config.cursorAtTextPos == true ? cursorPos : undefined;

			if (UILiveEditor.config.sliderWithLabel == true && text == UILiveEditor.uiElementTemplates.slider)
			{
				text += UILiveEditor.uiElementTemplates.sliderLabel;
			}

			var isSliderClass = (text.indexOf("Slider") != -1);

			if (isSliderClass == false && UILiveEditor.config.addIdAttribute == true)
			{
				text = text.replace("class", 'id="{generateId}" class');
			}
			else
			{
				UILiveEditor.document.elementCount++;
				UILiveEditor.uiElementTemplates.slider = '<div class="Slider" id="ui-slider-' + UILiveEditor.document.elementCount + '" min=0, max=100 value=75 step=1 inline=true></div>';
				UILiveEditor.uiElementTemplates.sliderLabel = '<div class="Label Value" bind="ui-slider-' + UILiveEditor.document.elementCount + '">{value}</div>';
			}

			var isGroupClass = (text.indexOf("Group") != -1);

			if (isGroupClass == false && UILiveEditor.config.setNoInline == true)
			{
				text = text.replace("></", ' inline=false></');
			}

			if (isGroupClass == true && UILiveEditor.config.setNoInline == true)
			{
				text = text.replace("inline=true", 'inline=false');
			}

			var doc = window.editor.getDoc();
			var cursor = window.editor.getCursor();
			doc.replaceRange(text, cursor);
			window.editor.focus();
			var length = cursorPos != undefined ? cursorPos + ((isGroupClass == true && UILiveEditor.config.setNoInline == true) ? UILiveEditor.document.cursorOffset - 12 : UILiveEditor.document.cursorOffset) : text.length
			cursor.ch += length;
			window.editor.setCursor(cursor);
			
			if (UILiveEditor.config.cursorAtTextPos == true && group != undefined)
			{
				var token = window.editor.getTokenAt(window.editor.getCursor());
				var indentationLevel = token.state.htmlState.indented;
				var identationString = "";

				for (var i = 0; i < indentationLevel; i++)
				{
					identationString += " ";
				}

				doc.replaceRange("\n\n" + identationString, cursor);
				cursor.line++;
				window.editor.setCursor(cursor);
				doc.replaceRange(identationString + "    ", cursor);
			}
			
			submitTryit(1);
		},

	function submitTryit(n) {
		if (window.editor)

		var ifrw = (ifr.contentWindow) ? ifr.contentWindow : (ifr.contentDocument.document) ? ifr.contentDocument.document : ifr.contentDocument;

		ifrw.document.open();
		ifrw.document.write(text);
		ifrw.document.close();

		if (ifrw.document.body && !ifrw.document.body.isContentEditable)

	function restack() {
		var l = $Id("textareacontainer");
		var c = $Id("dragbar");
		var r = $Id("iframecontainer");
		if (layout == "vertical") {
			l.style["height"] = c.style["height"] = r.style["height"] = "100%";
			l.style["width"] = "calc(" + leftwidthperc + "% - 6px)";
			c.style["width"] = "12px";
			c.style["cursor"] = "col-resize";
			r.style["width"] = "calc(" + (100 - leftwidthperc) + "% - 6px)";
			layout = "horizontal"
		} else {
			l.style["width"] = c.style["width"] = r.style["width"] = "100%";
			l.style["height"] = "calc(" + leftheightperc + "% - 6px)";
			c.style["height"] = "12px";
			c.style["cursor"] = "row-resize";
			r.style["height"] = "calc(" + (100 - leftheightperc) + "% - 6px)";
			layout = "vertical"		
		}
	}

	dragBalance($Id(("dragbar")));

	function dragBalance(balancer) {
		if (window.addEventListener) {
			balancer.addEventListener("mousedown", function(e) {dragstart(e);});
			window.addEventListener("mousemove", function(e) {dragmove(e);});
			window.addEventListener("mouseup", dragend);
		}

		var dragging = false;
		var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
		function dragstart(e) {
			e.preventDefault();
			e = e || window.event;
			// get the mouse cursor position at startup:
			pos3 = e.clientX;
			pos4 = e.clientY;
			dragging = true;
		}
		function dragmove(e) {
			var perc;
			if (dragging) {
				// show overlay to avoid interfering of mouse moving with textarea
				$Id("shield").style.display = "block";        
				e = e || window.event;
				// calculate the new cursor position:
				pos1 = pos3 - e.clientX;
				pos2 = pos4 - e.clientY;
				pos3 = e.clientX;
				pos4 = e.clientY;
				// set the element's new size:
				if (layout == "vertical") {
					var pos = pos2;
					var axe1 = "clientHeight";
					var axe2 = "height";
					perc = (balancer.previousElementSibling[axe1] + (balancer[axe1] / 2) - pos) * 100 / balancer.parentElement[axe1];
					leftheightperc = perc;
				} else {
					var pos = pos1;
					var axe1 = "clientWidth";
					var axe2 = "width";
					perc = (balancer.previousElementSibling[axe1] + (balancer[axe1] / 2) - pos) * 100 / balancer.parentElement[axe1];
					leftwidthperc = perc;
				}
				if (perc > 20 && perc < 80) {
					balancer.previousElementSibling.style[axe2] = "calc(" + (perc) + "% - " + (balancer[axe1] / 2) + "px)";
					balancer.nextElementSibling.style[axe2] = "calc(" + (100 - perc) + "% - " + (balancer[axe1] / 2) + "px)";
				}

				//UILiveEditor.setMenuItemDisplay();
			}
		}
		function dragend() {
			$Id("shield").style.display = "none";
			dragging = false;
			if (window.editor) {
				window.editor.refresh();
			}
		}
	}
